# Temporary, read-only Git three-way merge rehearsal.
# Delete this workflow before completing the integration PR.
name: OCA merge rehearsal (read only)

on:
  push:
    branches:
      - refactor/oca-19.0-integration-20261120

permissions:
  contents: read

jobs:
  merge-rehearsal:
    name: Dry-run three-way merge, record conflicts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Attempt exact upstream merge without commit or push
        id: rehearsal
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          mkdir -p merge-review/conflicts
          git status --porcelain=v1 --untracked-files=no > merge-review/status-before.txt
          git rev-parse HEAD > merge-review/branch-head.txt
          git fetch --no-tags https://github.com/OCA/connector-shopify.git \
            refs/heads/19.0:refs/remotes/oca/19.0
          git rev-parse refs/remotes/oca/19.0 > merge-review/upstream-head.txt
          # Git objects only, no checkout configuration or credentials.
          # Allows local offline semantic conflict resolution from this artifact.
          git bundle create merge-review/integration-repo.bundle HEAD refs/remotes/oca/19.0
          test "$(cat merge-review/upstream-head.txt)" = \
            "5454e91b2f1aa6225026b8cbf6058486607042f8"
          set +e
          git -c user.name="Switchology CI" \
            -c user.email="ci@example.invalid" \
            merge --no-commit --no-ff refs/remotes/oca/19.0 \
            > merge-review/merge.log 2>&1
          result=$?
          set -e
          echo "$result" > merge-review/merge-exit-code.txt
          git diff --name-only --diff-filter=U > merge-review/conflicted-paths.txt
          git diff --check > merge-review/diff-check.txt 2>&1 || true
          git diff --cached --stat > merge-review/auto-merged-stat.txt
          while IFS= read -r path; do
            if [[ -n "$path" && -f "$path" ]]; then
              mkdir -p "merge-review/conflicts/$(dirname "$path")"
              cp -- "$path" "merge-review/conflicts/$path"
            fi
          done < merge-review/conflicted-paths.txt
          {
            echo "### OCA three-way merge rehearsal (no commit, no push)"
            echo ""
            echo "Upstream: `$(cat merge-review/upstream-head.txt)`"
            echo "Merge exit: `$result` (nonzero = expected conflicts)"
            echo "Conflicted files: `$(wc -l < merge-review/conflicted-paths.txt)`"
            echo ""
            echo 'Conflicts:'
            echo '```'
            cat merge-review/conflicted-paths.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Dry-run semantic candidate resolution:"
          python scripts/resolve_oca_merge_candidate.py
          python -m compileall -q shopify_connector shopify_connector_account \
            shopify_connector_pos shopify_connector_website_sale
          git add -u
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --stat > merge-review/semantic-candidate-stat.txt
          git status --short > merge-review/semantic-candidate-status.txt
          git merge --abort 2>/dev/null || true

      - name: Upload conflict review (public source only)
        uses: actions/upload-artifact@v4
        with:
          name: oca-merge-rehearsal
          path: merge-review/
          if-no-files-found: error
          retention-days: 7
